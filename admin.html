<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter;
  background:#0b0f1a;
  color:white;
}

.top{
  padding:15px 20px;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-between;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

.dropzone{
  margin-top:15px;
  padding:40px;
  border:2px dashed rgba(255,255,255,0.3);
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.dropzone:hover{
  border-color:#6c5ce7;
  background:rgba(108,92,231,0.1);
}

.dropzone.dragover{
  border-color:#00d2ff;
  background:rgba(0,210,255,0.1);
}

button{
  margin-top:15px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#6c5ce7;
  color:white;
}

button:hover{
  opacity:0.9;
}

#status{
  margin-top:10px;
  opacity:0.7;
  white-space:pre-line;
}
</style>
</head>

<body>

<div class="top">
  <div>🛠 Admin Panel (Drag & Drop)</div>
  <button onclick="location.href='dashboard.html'">Dashboard</button>
</div>

<div class="container">

<div class="card">

<h2>Upload PDFs</h2>

<select id="grade">
  <option value="5">Grade 5</option>
  <option value="6">Grade 6</option>
  <option value="7">Grade 7</option>
  <option value="8">Grade 8</option>
</select>

<select id="unit">
  <option value="1">Unit 1</option>
  <option value="2">Unit 2</option>
  <option value="3">Unit 3</option>
  <option value="4">Unit 4</option>
  <option value="5">Unit 5</option>
  <option value="6">Unit 6</option>
  <option value="7">Unit 7</option>
  <option value="8">Unit 8</option>
  <option value="9">Unit 9</option>
  <option value="10">Unit 10</option>
</select>

<div id="dropzone" class="dropzone">
  📂 Drag & Drop PDF files here<br>
  or click to select
</div>

<input type="file" id="file" multiple accept="application/pdf" hidden>

<button onclick="uploadPDF()">Upload</button>

<div id="status">Waiting...</div>

</div>

</div>

<script type="module">
import { protectPage, isAdmin } from "./app.js";

/* auth + user bekle */
const user = await protectPage();

/* 🚪 admin değilse çık */
if (!isAdmin(user)) {
  window.location.href = "dashboard.html";
}
  
let selectedFiles = [];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("file");
const status = document.getElementById("status");

dropzone.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
  selectedFiles = [...e.target.files];
  status.innerText = `${selectedFiles.length} file selected`;
};

dropzone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("dragover");

  selectedFiles = [...e.dataTransfer.files];
  status.innerText = `${selectedFiles.length} file dropped`;
});
window.uploadPDF = async function () {
  if (!selectedFiles.length) {
    status.innerText = "No files selected ❌";
    return;
  }

  const grade = document.getElementById("grade").value;
  const unit = document.getElementById("unit").value;

  status.innerText = `Preparing 0/${selectedFiles.length}... ⏳`;

  try {
    for (let i = 0; i < selectedFiles.length; i++) {
      const file = selectedFiles[i];

      status.innerText =
        `Hashing ${i + 1}/${selectedFiles.length}: ${file.name}... ⏳`;

      const buffer = await file.arrayBuffer();

      const digest = await crypto.subtle.digest(
        "SHA-256",
        buffer
      );

      const hashBytes = new Uint8Array(digest);

      const sha256 = [...hashBytes]
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");

      const params = new URLSearchParams({
        grade,
        unit,
        filename: file.name,
        sha256,
        size: String(file.size)
      });

      status.innerText =
        `Uploading ${i + 1}/${selectedFiles.length}: ${file.name}... ⏳`;

      const response = await fetch(
        `https://englishwithtunahan-api.micromusti642.workers.dev/upload?${params}`,
        {
          method: "POST",
          headers: {
            "Content-Type": file.type || "application/octet-stream"
          },
          body: file
        }
      );

      const result = await response.json();

      console.log(result);

      if (!response.ok) {
        status.innerText =
          `❌ ${file.name}\n${result.error || "Upload failed"}${
            result.details ? `\n${result.details}` : ""
          }`;
        return;
      }

      status.innerText =
        `Uploaded ${i + 1}/${selectedFiles.length} ✅`;
    }

    status.innerText =
      `✅ ${selectedFiles.length} file(s) uploaded successfully!`;

    selectedFiles = [];
    fileInput.value = "";
  } catch (err) {
    console.error(err);
    status.innerText =
      `❌ Upload failed: ${err.message || err}`;
  }
};
</script>

</body>
</html>
